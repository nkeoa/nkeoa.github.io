<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>nekoae | nkeoa | nkeoae</title>
<meta name="description" content="nekoae (nkeoa, nkeoae) - personal site.">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    cursor: pointer;
  }
  .bg {
    height: 100vh;
    width: 100vw;
    background-image: url('background.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    position: relative;
  }
  .caption {
    position: absolute;
    bottom: 16px;
    right: 20px;
    color: rgba(255, 255, 255, 0.55);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 14px;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
  <div class="bg">
    <div class="caption">nekoae</div>
  </div>

  <audio id="sound" src="fubu.mp3" preload="auto"></audio>

  <script>
    const sound = document.getElementById('sound');
    function playOnce() {
      sound.play();
      document.removeEventListener('click', playOnce);
    }
    document.addEventListener('click', playOnce);
  </script>
</body>
</html>
